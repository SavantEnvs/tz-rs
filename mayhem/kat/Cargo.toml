[package]
name = "tz-rs-mayhem-kat"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate, not a member of any enclosing workspace (upstream's root Cargo.toml has no
# [workspace] table of its own; without this empty table cargo would try to fold this directory
# into an implicit workspace rooted at the upstream package and error that it "believes it's in a
# workspace when it's not"). Its own Cargo.lock is committed for the same reason.
[workspace]

[[bin]]
name = "kat_probe"
path = "src/main.rs"
test = false
doc = false

[dependencies.tz]
package = "tz-rs"
path = "../.."
